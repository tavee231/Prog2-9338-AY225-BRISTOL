<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Azure Terminal | BSIT-GD 1st Year</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000b1a; font-family: 'Courier New', monospace; color: #00d4ff; }
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: -1; }
        
        nav { 
            background: rgba(0, 20, 40, 0.9); border-bottom: 2px solid #00d4ff; 
            padding: 15px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10;
        }
        .nav-links { display: flex; gap: 30px; margin-left: 20px; }
        nav a { color: #00d4ff; text-decoration: none; font-weight: bold; cursor: pointer; text-shadow: 0 0 8px #00d4ff; }
        
        #globalLogout { 
            margin-right: 20px; color: #ff4d4d; border: 1px solid #ff4d4d; 
            padding: 5px 10px; font-size: 0.8em; cursor: pointer;
        }

        .page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 60px); width: 100%; position: absolute; transition: 0.5s; }
        .panel { background: rgba(0, 15, 30, 0.95); border: 2px solid #00d4ff; padding: 30px; border-radius: 15px; box-shadow: 0 0 30px #00d4ff; width: 420px; text-align: center; }
        .hidden { display: none !important; }
        .active { display: flex !important; }

        input { background: #001a33; border: 1px solid #00d4ff; color: #00d4ff; padding: 12px; margin: 10px 0; width: 90%; outline: none; }
        button { background: #00d4ff; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        
        .system-id { font-size: 0.75em; color: #66ccff; margin-top: 20px; border-top: 1px solid #004d66; padding-top: 10px; }
        .signature-box { margin-top: 20px; padding: 10px; border: 1px dashed #00d4ff; font-style: italic; font-family: 'Brush Script MT', cursive, sans-serif; font-size: 1.8em; }
        
        .hint-text { font-size: 0.65em; color: #555; margin-top: 10px; cursor: help; text-decoration: underline; }
        .history-table { width: 100%; max-height: 350px; overflow-y: auto; border: 1px solid #004d66; background: rgba(0, 10, 20, 0.8); }
        .log-row { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid #004d66; padding: 10px; font-size: 0.8em; }
        .header-row { background: #00334d; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <nav>
        <div class="nav-links">
            <a onclick="showPage('homePage')">TERMINAL_HOME</a>
            <a onclick="showPage('historyPage')">ARCHIVE_LOGS</a>
        </div>
        <div id="globalLogout" class="hidden" onclick="handleLogout()">TERMINATE: <span id="activeUserLabel"></span> [X]</div>
    </nav>

    <div id="homePage" class="page active">
        <div class="panel" id="loginBox">
            <h2>AZURE_ACCESS</h2>
            <input type="text" id="username" placeholder="IDENT_USER">
            <input type="password" id="password" placeholder="PASS_CODE">
            <button onclick="handleLogin()">SECURE LOGIN</button>
            <div class="hint-text" onclick="alert('Authorized: NovaAdmin, CyberSpectre, NexusUser, AzureRoot, EchoDelta')">Forgot identity? View Hints</div>
            
            <div class="system-id">
                COURSE: **BSIT-GD** | LEVEL: **1st Year**
            </div>
        </div>
        
        <div id="statusBox" class="panel hidden">
            <h2>SESSION_ACTIVE</h2>
            <p id="userDisplay"></p>
            <p id="timeInDisplay" style="color:#00ffff"></p>
            <div class="signature-box" id="userSignature"></div>
            <p style="font-size: 0.6em; letter-spacing: 2px; margin-top: 5px;">DIGITAL_SIGNATURE_VERIFIED</p>
            <div class="system-id">BSIT-GD 1st Year | Official Student Log</div>
        </div>
    </div>

    <div id="historyPage" class="page hidden">
        <div class="panel" style="width: 80%; max-width: 850px;">
            <h2>BSIT-GD CENTRAL ARCHIVES</h2>
            <div class="history-table">
                <div class="log-row header-row">
                    <div>USER</div><div>TIME_IN</div><div>TIME_OUT</div>
                </div>
                <div id="logContent"></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="downloadFullReport()">EXPORT_ARCHIVE</button>
                <button style="background:none; color:#ff4d4d; border:1px solid #ff4d4d;" onclick="clearStorage()">PURGE_MEMORY</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
